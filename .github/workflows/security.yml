# Leaked secrets (gitleaks), risky new dependencies in pull requests (dependency review) and
# known vulnerabilities in what we ship (Trivy on both images). Secrets and dependency review
# block merging; the image scan blocks deploying.
name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "30 2 * * 1" # Mondays: catch CVEs published since the last change

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high

  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            context: server
            ignores: server/.trivyignore
          - name: client
            context: client
            ignores: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build ${{ matrix.name }} image
        run: docker build -t eloka-partner-${{ matrix.name }}:scan ${{ matrix.context }}
      - name: Scan with Trivy (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: eloka-partner-${{ matrix.name }}:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: ${{ matrix.ignores }}
          exit-code: "1"
