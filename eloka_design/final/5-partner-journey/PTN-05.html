<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>

    body {
      min-height: max(884px, 100dvh);

<body class="bg-surface text-on-surface font-body antialiased min-h-screen flex justify-center">
<div class="w-full max-w-[440px] bg-surface-container-lowest min-h-screen flex flex-col justify-between shadow-sm relative">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-surface text-primary dark:text-inverse-primary flex justify-between items-center w-full px-4 h-16">
<div class="flex items-center gap-space-sm">
<span class="material-symbols-outlined text-primary text-xl cursor-pointer">arrow_back</span>
<span class="font-h2 text-h2 text-primary tracking-tight font-bold">ELOKA</span>
</div>
<button class="text-body-sm font-medium text-on-surface-variant hover:text-primary transition-colors">Help</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 px-4 py-space-lg overflow-y-auto pb-24">
<!-- Step Indicator -->
<div class="mb-space-sm">
<span class="text-label text-on-surface-variant uppercase tracking-wider font-semibold">Step 6 of 10</span>
</div>
<!-- Heading & Subtext -->
<div class="mb-space-xl">
<h1 class="font-h1 text-h1 text-on-surface mb-space-xs">Your home address</h1>
<p class="font-body-sm text-on-surface-variant">Where you live now.</p>
</div>
<!-- Form Card -->
<div class="bg-surface-container-lowest rounded-xl p-space-lg border border-[#E5E5E0] shadow-[0_1px_2px_rgba(0,0,0,0.04)] space-y-space-lg">
<!-- Address Line 1 -->
<div class="space-y-space-xs">
<label class="block text-label text-on-surface font-medium">Address line 1</label>
<input class="w-full px-space-md py-space-md bg-surface-container-lowest border border-[#85857F] rounded-lg text-body text-on-surface placeholder:text-on-surface-variant focus:outline-none focus:ring-2 focus:ring-[#11299E] focus:border-transparent transition-all" placeholder="Flat / House no., Building, Street" type="text"/>
</div>
<!-- Address Line 2 -->
<div class="space-y-space-xs">
<div class="flex justify-between items-center">
<label class="block text-label text-on-surface font-medium">Address line 2</label>
<span class="text-label text-on-surface-variant">Optional</span>
</div>
<input class="w-full px-space-md py-space-md bg-surface-container-lowest border border-[#85857F] rounded-lg text-body text-on-surface placeholder:text-on-surface-variant focus:outline-none focus:ring-2 focus:ring-[#11299E] focus:border-transparent transition-all" placeholder="Apartment, suite, unit, etc." type="text"/>
</div>
<!-- City & District Grid -->
<div class="grid grid-cols-2 gap-space-md">
<div class="space-y-space-xs">
<label class="block text-label text-on-surface font-medium">City</label>
<input class="w-full px-space-md py-space-md bg-surface-container-lowest border border-[#85857F] rounded-lg text-body text-on-surface placeholder:text-on-surface-variant focus:outline-none focus:ring-2 focus:ring-[#11299E] focus:border-transparent transition-all" placeholder="City" type="text"/>
</div>
<div class="space-y-space-xs">
<label class="block text-label text-on-surface font-medium">District</label>
<input class="w-full px-space-md py-space-md bg-surface-container-lowest border border-[#85857F] rounded-lg text-body text-on-surface placeholder:text-on-surface-variant focus:outline-none focus:ring-2 focus:ring-[#11299E] focus:border-transparent transition-all" placeholder="District" type="text"/>
</div>
</div>
<!-- State & Pincode Grid -->
<div class="grid grid-cols-2 gap-space-md">
<div class="space-y-space-xs">
<label class="block text-label text-on-surface font-medium">State</label>
<div class="relative">
<select class="w-full px-space-md py-space-md bg-surface-container-lowest border border-[#85857F] rounded-lg text-body text-on-surface focus:outline-none focus:ring-2 focus:ring-[#11299E] focus:border-transparent transition-all appearance-none">
<option disabled="" selected="" value="">Select state</option>
<option value="state1">Maharashtra</option>
<option value="state2">Karnataka</option>
<option value="state3">Delhi</option>
<option value="state4">Tamil Nadu</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none text-lg">expand_more</span>
</div>
</div>
<div class="space-y-space-xs">
<label class="block text-label text-on-surface font-medium">Pincode</label>
<input class="w-full px-space-md py-space-md bg-surface-container-lowest border border-[#85857F] rounded-lg text-body text-on-surface placeholder:text-on-surface-variant focus:outline-none focus:ring-2 focus:ring-[#11299E] focus:border-transparent transition-all" maxlength="6" placeholder="400001" type="text"/>
</div>
</div>
</div>
</main>
<!-- Bottom Action Footer -->
<footer class="absolute bottom-0 left-0 right-0 p-space-lg bg-surface-container-lowest/90 backdrop-blur-md">
<button class="w-full h-12 bg-[#0A0A0A] text-white rounded-lg font-h3 text-h3 flex items-center justify-center shadow-sm active:translate-y-[1px] transition-all">
        Save and continue
      </button>
</footer>
</div>
</body></html>
