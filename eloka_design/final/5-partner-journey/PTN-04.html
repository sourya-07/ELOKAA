<body class="bg-background text-on-background font-body antialiased min-h-screen flex flex-col justify-between selection:bg-primary-container selection:text-on-primary">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-inverse-surface w-full px-4 h-16 flex justify-between items-center z-40">
<div class="flex items-center gap-3">
<button aria-label="Go back" class="text-primary dark:text-inverse-primary p-2 -ml-2 rounded-lg hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<span class="font-h2 text-h2 text-primary dark:text-inverse-primary tracking-tight">ELOKA</span>
</div>
<div class="flex items-center">
<button class="font-h3 text-h3 text-primary dark:text-inverse-primary hover:text-on-surface-variant transition-colors px-3 py-1.5 rounded-lg hover:bg-surface-variant">
        Help
      </button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 max-w-[640px] w-full mx-auto px-4 py-6 pb-28">
<!-- Step Indicator -->
<div class="mb-4">
<span class="font-label text-label text-on-surface-variant uppercase tracking-wider">Step 4 of 10</span>
</div>
<!-- Header & Instructions -->
<div class="mb-6">
<h1 class="font-h1 text-h1 text-on-surface mb-2">Your PAN</h1>
<p class="font-body text-body text-on-surface-variant">We check your PAN with the Income Tax Department. Your name must match your Aadhaar.</p>
</div>
<!-- Form Section -->
<div class="bg-surface-container-lowest border border-[#E5E5E0] rounded-xl p-5 shadow-[0_1px_2px_rgba(0,0,0,0.04)] mb-6 space-y-4">
<!-- Field 1: PAN -->
<div class="space-y-1.5">
<label class="block font-label text-label text-on-surface" for="pan-input">PAN</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-[#85857F] rounded-lg px-3.5 py-3 font-body text-body text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 uppercase transition-all" id="pan-input" maxlength="10" placeholder="ABCDE1234F" type="text"/>
</div>
</div>
<!-- Field 2: Date of Birth -->
<div class="space-y-1.5">
<label class="block font-label text-label text-on-surface" for="dob-input">Date of birth</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-[#85857F] rounded-lg px-3.5 py-3 font-body text-body text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all" id="dob-input" placeholder="DD / MM / YYYY" type="text"/>
</div>
</div>
</div>
<!-- Error State Variant (Hidden by default, shown for spec completeness) -->
<div class="hidden bg-error-container/30 border border-error rounded-xl p-4 mb-6 flex items-start gap-3">
<span class="material-symbols-outlined text-error mt-0.5">error</span>
<div>
<h3 class="font-h3 text-h3 text-on-error-container mb-1">Verification failed</h3>
<p class="font-body-sm text-body-sm text-on-error-container">We couldn't verify this PAN. 2 attempts left.</p>
</div>
</div>
<!-- Verified Success Card Variant (Hidden by default, can be toggled) -->
<div class="hidden bg-surface-container-lowest border border-[#E5E5E0] rounded-xl p-4 mb-6 flex items-center justify-between shadow-[0_1px_2px_rgba(0,0,0,0.04)]">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-secondary-fixed flex items-center justify-center text-secondary">
<span class="material-symbols-outlined">check_circle</span>
</div>
<div>
<h3 class="font-h3 text-h3 text-on-surface">RAVI SAMPLE</h3>
<p class="font-body-sm text-body-sm text-on-surface-variant">XXXXX1234X</p>
</div>
</div>
<span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-100 text-emerald-800">Verified</span>
</div>
</main>
<!-- Bottom Action Bar / Navigation -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-between items-center px-4 py-3 bg-surface dark:bg-inverse-surface md:hidden">
<div class="w-full">
<button class="w-full h-12 bg-primary text-on-primary rounded-lg font-h3 text-h3 flex items-center justify-center shadow-sm active:scale-[0.98] transition-all duration-200">

</div>
