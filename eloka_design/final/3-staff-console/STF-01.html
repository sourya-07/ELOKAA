<body class="bg-background text-on-background font-body min-h-screen flex items-center justify-center p-space-xl">
<div class="w-full max-w-[440px] flex flex-col gap-space-xl">
<!-- Main Card -->
<div class="bg-surface-container-lowest border border-[#E5E5E0] rounded-xl p-space-2xl shadow-[0_1px_2px_rgba(0,0,0,0.04)] flex flex-col gap-space-xl">
<!-- Header Section -->
<div class="flex items-center justify-between">
<span class="font-h1 text-h1 text-on-surface">ELOKA</span>
<span class="px-space-sm py-space-xs bg-surface-container-low text-on-surface-variant font-label text-label rounded-full border border-outline-variant">Staff console</span>
</div>
<!-- Title -->
<h1 class="font-h2 text-h2 text-on-surface">Sign in</h1>
<!-- Google Sign In -->
<div class="flex flex-col gap-space-sm">
<button class="w-full flex items-center justify-center gap-space-md py-space-md px-space-lg rounded-lg border border-outline-variant bg-surface-container-lowest hover:bg-surface-container-low text-on-surface font-h3 text-h3 transition-colors active:translate-y-px duration-75">
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"></path>
</svg>
          Sign in with Google
        </button>
<span class="text-body-sm font-body-sm text-on-surface-variant text-center">Use your Eko work account</span>
</div>
<!-- Divider -->
<div class="relative flex items-center justify-center my-space-xs">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant"></div>
</div>
<span class="relative px-space-sm bg-surface-container-lowest text-label font-label text-on-surface-variant uppercase tracking-wider">Development only</span>
</div>
<!-- Compact Form -->
<div class="flex flex-col gap-space-lg">
<!-- Mobile Number Input -->
<div class="flex flex-col gap-space-xs">
<label class="text-label font-label text-on-surface">Mobile number</label>
<div class="flex gap-space-sm">
<div class="flex items-center px-space-md py-space-sm bg-surface-container-low border border-[#85857F] rounded-lg text-body-sm font-body-sm text-on-surface-variant">
              +91
            </div>
<input class="flex-1 px-space-md py-space-sm bg-surface-container-lowest border border-[#85857F] rounded-lg text-body-sm font-body-sm text-on-surface focus:outline-none focus:ring-2 focus:ring-secondary" placeholder="Enter mobile number" type="text"/>
<button class="px-space-lg py-space-sm bg-primary text-on-primary font-h3 text-h3 rounded-lg hover:bg-surface-tint transition-colors active:translate-y-px duration-75">
              Send code
            </button>
</div>
</div>
<!-- Six Digit Boxes -->
<div class="flex flex-col gap-space-xs">
<label class="text-label font-label text-on-surface">Verification code</label>
<div class="flex gap-space-sm justify-between">
<input class="w-10 h-12 text-center bg-surface-container-lowest border border-[#85857F] rounded-lg text-body font-body focus:outline-none focus:ring-2 focus:ring-secondary" maxlength="1" type="text"/>
<input class="w-10 h-12 text-center bg-surface-container-lowest border border-[#85857F] rounded-lg text-body font-body focus:outline-none focus:ring-2 focus:ring-secondary" maxlength="1" type="text"/>
<input class="w-10 h-12 text-center bg-surface-container-lowest border border-[#85857F] rounded-lg text-body font-body focus:outline-none focus:ring-2 focus:ring-secondary" maxlength="1" type="text"/>
<input class="w-10 h-12 text-center bg-surface-container-lowest border border-[#85857F] rounded-lg text-body font-body focus:outline-none focus:ring-2 focus:ring-secondary" maxlength="1" type="text"/>
<input class="w-10 h-12 text-center bg-surface-container-lowest border border-[#85857F] rounded-lg text-body font-body focus:outline-none focus:ring-2 focus:ring-secondary" maxlength="1" type="text"/>
<input class="w-10 h-12 text-center bg-surface-container-lowest border border-[#85857F] rounded-lg text-body font-body focus:outline-none focus:ring-2 focus:ring-secondary" maxlength="1" type="text"/>
</div>
</div>
<!-- Verify Button -->
<button class="w-full py-space-md px-space-lg bg-primary text-on-primary font-h3 text-h3 rounded-lg hover:bg-surface-tint transition-colors active:translate-y-px duration-75 mt-space-xs">
          Verify
        </button>
</div>
</div>
<!-- Inline Error Examples -->
<div class="flex flex-col gap-space-sm">
<!-- Error 1 -->
<div class="flex items-start gap-space-sm p-space-md bg-error-container text-on-error-container rounded-lg border border-error/20">
<span class="material-symbols-outlined text-[20px]">error</span>
<span class="text-body-sm font-body-sm">Your account isn't enabled for the staff console. Ask an admin.</span>
</div>
<!-- Error 2 -->
<div class="flex items-start gap-space-sm p-space-md bg-error-container text-on-error-container rounded-lg border border-error/20">
<span class="material-symbols-outlined text-[20px]">error</span>
<span class="text-body-sm font-body-sm">Google sign-in isn't configured on this environment.</span>
</div>
</div>
</div>
</body></html>
