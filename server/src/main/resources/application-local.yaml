# Developer laptop. MySQL comes from compose.yaml (started automatically by bootRun).
# Every value here is a published DEVELOPMENT value: ProductionSafetyGuard refuses them outside local/test.
server:
  port: ${SERVER_PORT:8091} # next to the eloka server (8090)

spring:
  docker:
    compose:
      lifecycle-management: start-only

logging:
  level:
    in.eko.eloka.partner: DEBUG

eloka:
  environment: local
  staff:
    otp-login-enabled: true # seeded staff 9000000006 (reviewer), …07 (approver), …08 (both); OTP 123456
  cors-allowed-origin-patterns:
    - http://localhost:[*]
  crypto:
    field-key: cGFydG5lci1sb2NhbC1maWVsZC1rZXktMzItYnl0ZXM=
    index-key: cGFydG5lci1sb2NhbC1pbmRleC1rZXktMzItYnl0ZXM=
  identity:
    email-fixed-code: "123456" # email codes (no email is sent locally)
    otp-min-gap: 0s
    otp-max-per-hour: 1000
    otp-max-per-day: 1000
    otp-max-per-ip-per-hour: 1000
  integration:
    otp-provider: fake # every OTP is 123456, no SMS
    identity-provider: fake # PAN and DigiLocker answers by PAN digits (docs/LOCAL_DEVELOPMENT.md)
    credit-bureau: fake
    malware-scanner: fake
    email-provider: fake # no email is sent; the email code is the fixed one below
    geocoder:
      provider: nominatim # the free OpenStreetMap lookup, so the address shows locally too
