# Settings shared by every environment. Environment-specific values live in
# application-<profile>.yaml. Secrets come only from environment variables.
spring:
  application:
    name: eloka-partner-server
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # the schema is owned by Flyway migrations, never by Hibernate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 10MB # above the largest rule (5 MB, DocumentKind) so most oversized files get the rule's own message
      max-request-size: 25MB
  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: native # trust X-Forwarded-* only from proxies in server.tomcat.remoteip
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mail:
      enabled: false # an SMTP outage must not mark the whole server unhealthy
  info:
    env:
      enabled: false

logging:
  file:
    path: ${ELOKA_LOG_DIR:logs}

eloka:
  environment: ${ELOKA_ENVIRONMENT:local}
  identity:
    otp-length: 6
    otp-ttl: 5m
    otp-max-attempts: 5
    otp-min-gap: 60s # the client shows "Resend in 1 min" from resend_after / retry_after
    otp-max-per-hour: 5
    otp-max-per-day: 10
    otp-max-per-ip-per-hour: 10
    session-idle-timeout: 2h
    session-absolute-ttl: 12h
    access-token-ttl: 30m
    email-otp-ttl: 10m # email can arrive slower than SMS
  # Staff console sign-in (Google, Workspace domain only); OTP sign-in is local/test only
  staff:
    google-client-id: ${ELOKA_STAFF_GOOGLE_CLIENT_ID:}
    google-domain: ${ELOKA_STAFF_GOOGLE_DOMAIN:eko.co.in}
    otp-login-enabled: false
  # Providers (ADR-0004). none = refuse with PROVIDER_NOT_CONFIGURED; fake = local/test only.
  integration:
    otp-provider: none
    identity-provider: none # PAN + DigiLocker
    credit-bureau: none     # no bureau contracted yet (docs/OPEN_QUESTIONS.md Q-1)
    malware-scanner: none   # PDFs are refused until a scanner is configured
    email-provider: none    # email codes; smtp uses spring.mail.* (EPS has no email OTP)
    geocoder:               # live photo's approximate address (docs/OPEN_QUESTIONS.md C-11); never blocks an upload
      provider: none        # none | fake | nominatim (OpenStreetMap's free public service, 1 lookup per second)
  # Voter ID / driving licence holder vs the DigiLocker name (EPS Name Match, 0..1; 0.85+ is a good match, Q-23)
  verification:
    name-match-min-score: 0.85
  documents:
    storage-path: ${ELOKA_STORAGE_PATH:data/files}
  # Partner application rules. Open business questions (docs/OPEN_QUESTIONS.md) are settings here.
  onboarding:
    idle-expiry: 30d
    max-attempts: 3
    consent-version: "2026-10-27"
    declaration-version: "2026-10-27"
    # The live photo's location (docs/OPEN_QUESTIONS.md Q-24): refused when rougher than max, flagged above flag
    location:
      max-accuracy-m: 1000
      flag-accuracy-m: 100
    # The client page DigiLocker sends the applicant back to
    digilocker-return-url: ${ELOKA_PUBLIC_URL:http://localhost:3003}/apply/identity?state={state}
