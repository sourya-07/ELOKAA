# Settings shared by every environment. Environment-specific values live in
# application-<profile>.yaml. Secrets come only from environment variables.
spring:
  application:
    name: eloka-partner-server
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # the schema is owned by Flyway migrations, never by Hibernate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: native # trust X-Forwarded-* only from proxies in server.tomcat.remoteip
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: false

logging:
  file:
    path: ${ELOKA_LOG_DIR:logs}

eloka:
  environment: ${ELOKA_ENVIRONMENT:local}
  identity:
    otp-length: 6
    otp-ttl: 5m
    otp-max-attempts: 5
    otp-min-gap: 30s
    otp-max-per-hour: 5
    otp-max-per-day: 10
    otp-max-per-ip-per-hour: 10
    session-idle-timeout: 2h
    session-absolute-ttl: 12h
    access-token-ttl: 30m
  # Providers (ADR-0004). none = refuse with PROVIDER_NOT_CONFIGURED; fake = local/test only.
  integration:
    otp-provider: none
  # Partner application rules. Open business questions (docs/OPEN_QUESTIONS.md) are settings here.
  onboarding:
    idle-expiry: 30d
    max-attempts: 3
    consent-version: "2026-10-27"
    declaration-version: "2026-10-27"
