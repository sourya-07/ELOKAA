# Settings shared by every environment. Environment-specific values live in
# application-<profile>.yaml. Secrets come only from environment variables.
spring:
  application:
    name: eloka-partner-server
  profiles:
    default: local
  mvc:
    problemdetails:
      enabled: true
  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: false
