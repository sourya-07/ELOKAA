# Automated tests (profile "test"). Throwaway values; MySQL comes from Testcontainers.
spring:
  docker:
    compose:
      enabled: false

logging:
  file:
    path: build/test-logs

eloka:
  environment: test
  staff:
    otp-login-enabled: true
  cors-allowed-origin-patterns:
    - http://localhost:[*]
  crypto:
    field-key: cGFydG5lci10ZXN0LWZpZWxkLWtleS0zMi1ieXRlcyE=
    index-key: cGFydG5lci10ZXN0LWluZGV4LWtleS0zMi1ieXRlcyE=
  integration:
    otp-provider: fake
    identity-provider: fake
    credit-bureau: fake
    malware-scanner: fake
    email-provider: fake # no email is sent; the email code is the fixed one below
    face-check:
      provider: fake # answers by the picture's corner colour (FakeFaceCheck)
    geocoder:
      provider: fake # an address that says it is made up; no network in tests
  documents:
    storage-path: build/test-files
  identity:
    email-fixed-code: "123456" # email codes (no email is sent locally)
    otp-max-per-ip-per-hour: 1000 # every MockMvc request comes from 127.0.0.1
