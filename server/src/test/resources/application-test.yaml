# Automated tests (profile "test"). Throwaway values; MySQL comes from Testcontainers.
spring:
  docker:
    compose:
      enabled: false

logging:
  file:
    path: build/test-logs

eloka:
  environment: test
  cors-allowed-origin-patterns:
    - http://localhost:[*]
  crypto:
    field-key: cGFydG5lci10ZXN0LWZpZWxkLWtleS0zMi1ieXRlcyE=
    index-key: cGFydG5lci10ZXN0LWluZGV4LWtleS0zMi1ieXRlcyE=
  integration:
    otp-provider: fake
  identity:
    otp-max-per-ip-per-hour: 1000 # every MockMvc request comes from 127.0.0.1
