# ELOKA partner onboarding, staging or production: MySQL, one-shot migration, server, web app,
# ClamAV and the TLS edge (Caddy). Only the edge publishes ports (80/443); the server is reached
# only by the web app's proxy on the internal network (ADR-0003).
#   cp .env.example .env   # fill in real values (never commit .env)
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --wait
# Operations (deploy, rollback, backups, first staff account): docs/deploy/RUNBOOK.md
name: eloka-partner

x-server-image: &server-image ${ELOKA_IMAGE_PREFIX:-eloka-partner}-server:${ELOKA_VERSION:-latest}

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: eloka_partner
      MYSQL_USER: ${ELOKA_DB_USERNAME}
      MYSQL_PASSWORD: ${ELOKA_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command: ["--binlog-expire-logs-seconds=604800"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 30
    deploy:
      resources:
        limits:
          memory: 1g
    # No published port: only the server talks to MySQL.

  migrate:
    # Same image; runs Flyway once and exits. The server itself never changes the schema.
    image: *server-image
    build: ../server
    env_file: ${ELOKA_ENV_FILE:-.env}
    environment:
      ELOKA_DB_URL: jdbc:mysql://mysql:3306/eloka_partner
      ELOKA_DB_MIGRATE_ON_START: "true"
      SPRING_PROFILES_ACTIVE: prod,migrate
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
    healthcheck:
      disable: true
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  clamav:
    # Scans uploaded PDFs (ADR-0006). Needs about 1.5 GB of memory once its database is loaded.
    image: clamav/clamav:1.4
    restart: unless-stopped
    volumes:
      - clamav-db:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      start_period: 300s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2g

  server:
    image: *server-image
    restart: unless-stopped
    env_file: ${ELOKA_ENV_FILE:-.env}
    environment:
      ELOKA_DB_URL: jdbc:mysql://mysql:3306/eloka_partner
      ELOKA_CLAMAV_HOST: clamav
    depends_on:
      migrate:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
    volumes:
      - server-files:/app/data # encrypted uploads: back up with deploy/backup.sh
    deploy:
      resources:
        limits:
          memory: 1g

  staff-bootstrap:
    # One-shot: create or update a staff account (RUNBOOK "First staff account"). Not started by `up`.
    image: *server-image
    profiles: [tools]
    env_file: ${ELOKA_ENV_FILE:-.env}
    environment:
      ELOKA_DB_URL: jdbc:mysql://mysql:3306/eloka_partner
      SPRING_PROFILES_ACTIVE: prod,staff-bootstrap
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  client:
    image: ${ELOKA_IMAGE_PREFIX:-eloka-partner}-client:${ELOKA_VERSION:-latest}
    build: ../client
    restart: unless-stopped
    environment:
      ELOKA_SERVER_URL: http://server:8080
      # Read at request time, so one image serves staging and production
      ELOKA_STAFF_GOOGLE_CLIENT_ID: ${ELOKA_STAFF_GOOGLE_CLIENT_ID:-}
    depends_on:
      server:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m

  edge:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      ELOKA_DOMAIN: ${ELOKA_DOMAIN}
      ELOKA_ACME_EMAIL: ${ELOKA_ACME_EMAIL}
      ELOKA_CADDY_GLOBAL: ${ELOKA_CADDY_GLOBAL:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data # certificates: keep this volume
      - caddy-config:/config
    depends_on:
      client:
        condition: service_healthy

volumes:
  mysql-data:
  server-files:
  clamav-db:
  caddy-data:
  caddy-config:
